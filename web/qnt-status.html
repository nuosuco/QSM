<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>QNT量子交易</title>
<style>body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:20px}h1{color:#0f0}.ok{color:#0f0}.warn{color:#ff0}.err{color:#f00}.row{display:flex;gap:20px;margin:10px 0}.box{border:1px solid #0f0;padding:15px;min-width:300px}.label{color:#0a0}</style>
</head>
<body>
<h1>🧬 QNT量子交易系统 v0.0.1</h1>
<div class="row">
<div class="box"><div class="label">引擎状态</div><div id="engine">--</div></div>
<div class="box"><div class="label">账户权益</div><div id="equity">--</div></div>
<div class="box"><div class="label">最新价差</div><div id="spread">--</div></div>
</div>
<div class="row"><div class="box" style="width:100%"><div class="label">实时价差监控</div><pre id="spreads" style="margin:0"></pre></div></div>
<div class="row"><div class="box"><div class="label">策略权重</div><pre id="weights">--</pre></div>
<div class="box"><div class="label">数据统计</div><pre id="stats">--</pre></div></div>
<script>
async function fetchApi(path){try{return(await fetch('/api/'+path)).json()}catch(e){return null}}
async function refresh(){
  const now=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
  document.getElementById('engine').innerHTML=`<span class="ok">✅ 运行中 ${now}</span>`;
  const sp=await fetchApi('qnt/spread');
  if(sp&&sp.spreads.length){
    const best=sp.spreads.reduce((a,b)=>a.sp>b.sp?a:b);
    document.getElementById('spread').innerHTML=`<span class="${best.sp>=0.13?'ok':'warn'}">${best.exchange} ${best.symbol}: ${best.sp.toFixed(4)}%</span>`;
    document.getElementById('spreads').textContent=sp.spreads.map(s=>`${s.exchange.padEnd(8)}${s.symbol.padEnd(12)}${s.sp.toFixed(4)}%`).join('\n');
  }
  const eq=await fetchApi('qnt/equity');
  if(eq)document.getElementById('equity').innerHTML=`<span class="ok">$${eq.total.toFixed(2)} USDT</span>`;
  const st=await fetchApi('qnt/stats');
  if(st)document.getElementById('stats').textContent=`market_data: ${st.market_data_count} ticks\nengine_signals: ${st.signal_count}\ndb_size: ${st.db_size}`;
}
refresh();setInterval(refresh,10000);
</script>
</body>
</html>
