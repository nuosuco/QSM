<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QEntL 字形识别测试</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #0a0e1a;
    color: #c8d8e8;
}
h1 { color: #00d4ff; text-align: center; }
.section {
    background: rgba(20, 30, 60, 0.8);
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
    border: 1px solid rgba(0, 212, 255, 0.2);
}
.glyph-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 15px;
}
.glyph-cell {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
}
.glyph-cell:hover {
    background: rgba(0, 212, 255, 0.2);
    transform: scale(1.05);
}
.glyph-cell.selected {
    background: rgba(255, 107, 157, 0.3);
    border: 2px solid #ff6b9d;
}
.pixel-grid {
    display: grid;
    grid-template-columns: repeat(8, 8px);
    gap: 1px;
    justify-content: center;
    margin: 10px 0;
}
.pixel {
    width: 8px;
    height: 8px;
    border-radius: 1px;
}
.pixel.on { background: #00d4ff; }
.pixel.off { background: #333; }
.char-display {
    font-size: 48px;
    color: #ffe66d;
    margin: 10px 0;
    font-family: 'YiTongyong', sans-serif;
}
.prediction {
    font-size: 24px;
    color: #7bed9f;
    margin: 10px 0;
}
.status {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    margin-bottom: 20px;
}
.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff6b6b;
}
.dot.connected { background: #7bed9f; }
.btn {
    background: #00d4ff;
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}
.btn:hover { background: #00b8d4; }
.btn.secondary { background: transparent; border: 1px solid #00d4ff; color: #00d4ff; }
.info { font-size: 12px; color: #6a7a8a; margin-top: 10px; }
</style>
</head>
<body>
<h1>QEntL 字形识别测试</h1>

<div class="status" id="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">连接中...</span>
</div>

<div class="section">
    <h3>16个彝文字形 (点击选择)</h3>
    <div class="glyph-grid" id="glyph-grid"></div>
</div>

<div class="section" id="prediction-section" style="display:none;">
    <h3>预测结果</h3>
    <div class="char-display" id="char-display"></div>
    <div class="pixel-grid" id="pixel-grid"></div>
    <div class="prediction" id="prediction"></div>
    <div class="info" id="info"></div>
</div>

<div class="section">
    <h3>API状态</h3>
    <button class="btn" onclick="testAPI()">测试API</button>
    <button class="btn secondary" onclick="reloadPage()">刷新</button>
    <div class="info" id="api-info"></div>
</div>

<script src="glyph_recognizer.js"></script>
<script>
let selectedGlyph = null;

async function testAPI() {
    try {
        const resp = await fetch('http://localhost:8765/');
        const data = await resp.json();
        document.getElementById('status-text').textContent = `服务: ${data.service}`;
        document.getElementById('dot').classList.add('connected');
        document.getElementById('api-info').textContent = 
            `模型: ${data.model}\n准确率: ${data.accuracy}`;
    } catch (e) {
        document.getElementById('status-text').textContent = 'API连接失败';
        document.getElementById('api-info').textContent = e.message;
    }
}

async function loadGlyphs() {
    try {
        const resp = await fetch('http://localhost:8765/glyphs/');
        const glyphs = await resp.json();
        
        const grid = document.getElementById('glyph-grid');
        grid.innerHTML = '';
        
        glyphs.forEach((g, idx) => {
            const cell = document.createElement('div');
            cell.className = 'glyph-cell';
            cell.onclick = () => selectGlyph(g, cell);
            
            // 像素图
            let pixelHtml = '<div class="pixel-grid">';
            for (let i = 0; i < 64; i++) {
                pixelHtml += `<div class="pixel ${g.pixels[i] ? 'on' : 'off'}"></div>`;
            }
            pixelHtml += '</div>';
            
            cell.innerHTML = `
                ${pixelHtml}
                <div class="info">样本${g.label}</div>
            `;
            grid.appendChild(cell);
        });
        
        // 初始化识别器
        await window.glyphRecognizer.init();
        
    } catch (e) {
        console.error('加载字形失败:', e);
    }
}

function selectGlyph(glyph, cell) {
    // 清除之前的选择
    document.querySelectorAll('.glyph-cell').forEach(c => c.classList.remove('selected'));
    cell.classList.add('selected');
    selectedGlyph = glyph;
    
    // 显示预测
    const section = document.getElementById('prediction-section');
    section.style.display = 'block';
    
    // 显示字符
    const code = parseInt(glyph.code, 16);
    document.getElementById('char-display').textContent = String.fromCharCode(code);
    
    // 显示像素
    let pixelHtml = '<div class="pixel-grid">';
    for (let i = 0; i < 64; i++) {
        pixelHtml += `<div class="pixel ${glyph.pixels[i] ? 'on' : 'off'}"></div>`;
    }
    pixelHtml += '</div>';
    document.getElementById('pixel-grid').innerHTML = pixelHtml;
    
    // 预测
    const result = window.glyphRecognizer.predict(glyph.pixels);
    document.getElementById('prediction').textContent = 
        `预测: 样本${result.prediction} (置信度: ${(result.confidence * 100).toFixed(1)}%)`;
    
    const isCorrect = result.prediction === glyph.label;
    document.getElementById('prediction').style.color = isCorrect ? '#7bed9f' : '#ff6b6b';
    
    document.getElementById('info').textContent = 
        `真实标签: ${glyph.label} | 码点: ${glyph.code} | 激活像素: ${glyph.pixels.filter(p=>p).length}/64`;
}

// 页面加载时测试
testAPI();
loadGlyphs();
</script>
</body>
</html>
