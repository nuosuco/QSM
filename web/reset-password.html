<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOM松麦 · 重置密码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .card {
            background: #fff; border-radius: 16px; padding: 32px 24px; max-width: 380px; width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
        }
        .logo { font-size: 40px; margin-bottom: 8px; }
        h1 { font-size: 20px; color: #333; margin-bottom: 4px; }
        .sub { font-size: 13px; color: #999; margin-bottom: 24px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; text-align: left; }
        .field input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px;
        }
        .btn {
            width: 100%; padding: 13px; background: #4a9d6e; color: #fff; border: none;
            border-radius: 10px; font-size: 16px; margin-top: 8px; cursor: pointer;
        }
        .btn:disabled { background: #ccc; }
        .msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
        .msg.err { color: #e74c3c; }
        .msg.ok { color: #27ae60; }
        .msg.info { color: #666; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🌿</div>
    <h1>重置密码</h1>
    <p class="sub">SOM松麦 · 输入新密码完成重置</p>
    <div id="form">
        <div class="field">
            <label>新密码</label>
            <input type="password" id="pwd" placeholder="至少6位" maxlength="32">
        </div>
        <div class="field">
            <label>确认新密码</label>
            <input type="password" id="pwd2" placeholder="再输一遍" maxlength="32">
        </div>
        <button class="btn" id="submit" onclick="doReset()">确认重置</button>
        <p class="msg info" id="msg">请填写新密码</p>
    </div>
    <div id="done" style="display:none;">
        <p style="font-size:40px;margin-bottom:12px;">✅</p>
        <h2 style="color:#27ae60;margin-bottom:8px;">密码重置成功</h2>
        <p style="color:#666;font-size:14px;margin-bottom:20px;">请用新密码登录</p>
        <a href="./" style="display:inline-block;padding:12px 32px;background:#4a9d6e;color:#fff;border-radius:10px;text-decoration:none;">去登录</a>
    </div>
</div>
<script>
const API_BASE = location.origin;
const params = new URLSearchParams(location.search);
const token = params.get('token');
if (!token) {
    document.getElementById('form').style.display = 'none';
    document.getElementById('msg').textContent = '链接无效，请重新从重置邮件进入';
    document.getElementById('msg').className = 'msg err';
}
function doReset() {
    const p1 = document.getElementById('pwd').value;
    const p2 = document.getElementById('pwd2').value;
    const msg = document.getElementById('msg');
    if (p1.length < 6) { msg.textContent = '密码至少6位'; msg.className = 'msg err'; return; }
    if (p1 !== p2) { msg.textContent = '两次密码不一致'; msg.className = 'msg err'; return; }
    document.getElementById('submit').disabled = true;
    msg.textContent = '正在重置…'; msg.className = 'msg info';
    fetch(API_BASE + '/api/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, new_password: p1 })
    }).then(r => r.json()).then(data => {
        if (data.success) {
            document.getElementById('form').style.display = 'none';
            document.getElementById('done').style.display = 'block';
        } else {
            msg.textContent = data.error || data.detail || '重置失败，链接可能已过期';
            msg.className = 'msg err';
            document.getElementById('submit').disabled = false;
        }
    }).catch(() => {
        msg.textContent = '网络错误，请重试'; msg.className = 'msg err';
        document.getElementById('submit').disabled = false;
    });
}
</script>
</body>
</html>
