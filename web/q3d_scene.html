<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Q3D — QEntL量子3D场景</title>
<style>
body{margin:0;overflow:hidden;background:#0a0e1a;font-family:sans-serif}
canvas{display:block}
#info{position:fixed;bottom:10px;left:10px;color:#6a7a8a;font-size:12px}
</style>
</head>
<body>
<div id="info">QEntL 3D — 纯量子操作系统视觉化</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var sceneData = [{"type":"sphere","x":0,"y":0,"z":0,"r":60,"color":"#00d4ff","label":"QSM"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"sphere","x":40,"y":0,"z":0,"r":10,"color":"#ff6b9d","label":"QEntL"},{"type":"beam","x1":40,"y1":0,"z1":0,"x2":-40,"y2":0,"z2":0,"color":"#ffd700"},{"type":"particle","x":0,"y":0,"z":0,"color":"#7bed9f","speed":3"}];
// Three.js 场景渲染（读取sceneData，渲染球体/光链/粒子）
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,1,1000);
camera.position.set(0,50,150);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x0a0e1a);
document.body.appendChild(renderer.domElement);
sceneData.forEach(function(obj){
  if(obj.type=='sphere'){
    var geo=new THREE.SphereGeometry(obj.r,32,32);
    var mat=new THREE.MeshPhongMaterial({color:obj.color,transparent:true,opacity:0.8});
    var mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(obj.x,obj.y,obj.z);
    scene.add(mesh);
  }else if(obj.type=='beam'){
    var points=[];points.push(new THREE.Vector3(obj.x1,obj.y1,obj.z1));
    points.push(new THREE.Vector3(obj.x2,obj.y2,obj.z2));
    var geo=new THREE.BufferGeometry().setFromPoints(points);
    var mat=new THREE.LineBasicMaterial({color:obj.color});
    scene.add(new THREE.Line(geo,mat));
  }else if(obj.type=='particle'){
    var geo=new THREE.SphereGeometry(2,8,8);
    var mat=new THREE.MeshBasicMaterial({color:obj.color});
    var mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(obj.x,obj.y,obj.z);
    scene.add(mesh);
  }
});
var light=new THREE.AmbientLight(0x404060);scene.add(light);
var light2=new THREE.DirectionalLight(0xffffff,0.5);light2.position.set(1,1,1);scene.add(light2);
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}
animate();
window.addEventListener('resize',function(){renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix()});
</script>
</body>
</html>
