<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>QEntL 量子操作系统</title>
<style>
@font-face{font-family:'LSTY-Yi-Black';src:local('LSTY-Yi-Black'),local('YiTongyong'),url('/fonts/lingyi.ttf') format('truetype');font-display:swap}
@font-face{font-family:'LSTY-Yi-SMP';src:local('LSTY-Yi-Black'),local('YiTongyong'),url('/fonts/lingyi_smp.ttf') format('truetype');font-display:swap}
html,body{font-family:'YiTongyong','LSTY-Yi-Black','LSTY-Yi-SMP',system-ui,sans-serif;background:#0a0e1a;color:#c8d8e8;overflow:hidden;height:100vh;width:100vw;margin:0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--card:rgba(20,30,60,0.85);--accent:#00d4ff;--yi:#ff6b9d}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#desktop{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;width:100vw}
#taskbar{display:flex;align-items:center;justify-content:space-between;padding:6px 6px;background:rgba(10,14,26,0.95);border-bottom:1px solid rgba(0,212,255,0.2);height:44px;flex-shrink:0;z-index:10;gap:2px}
#taskbar .title{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
#taskbar .lang-switch{display:flex;gap:4px;flex-shrink:0}
#taskbar .lang-btn{padding:6px 10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#ddd;font-size:14px;cursor:pointer}
#taskbar .lang-btn.active{background:rgba(0,212,255,0.35);color:#fff}
#taskbar .lang-btn .yi-text{font-family:'LSTY-Yi-SMP';font-size:15px;color:#ffe66d}
#taskbar #clock{font-size:12px;color:#6a7a8a;min-width:50px;text-align:right;flex-shrink:0;margin-left:auto}
/* ==== 桌面网格 ==== */
#desktop-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:auto;gap:10px 6px;padding:10px 6px;align-content:start;justify-items:center;width:100%;max-width:480px;margin:0 auto}
.desktop-icon{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;padding:12px 4px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);text-align:center}
.desktop-icon .icon{font-size:38px;line-height:1}
.desktop-icon .label{font-size:13px;color:#eee;line-height:1.2;word-break:break-word}
.desktop-icon .label.yi-text{font-family:'LSTY-Yi-SMP';font-size:14px;color:#ffe66d}
/* ==== 应用窗口 ==== */
#window{display:none;position:fixed;top:8%;left:1%;right:1%;bottom:3%;background:var(--card);border:1px solid rgba(0,212,255,0.2);border-radius:12px;z-index:100;flex-direction:column;backdrop-filter:blur(20px);overflow:hidden}
#window.show{display:flex}
#window .win-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(0,212,255,0.2);flex-shrink:0}
#window .win-header .win-title{font-size:15px;font-weight:600;color:var(--accent)}
#window .win-header .win-close{background:none;border:none;color:#c8d8e8;font-size:22px;cursor:pointer;line-height:1}
#window .win-body{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px;font-size:14px;min-height:0}
.status-bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;align-items:center;font-size:12px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.green{background:#7bed9f}.status-dot.blue{background:var(--accent)}.status-dot.yellow{background:#ffd700}
/* ==== 助手 ==== */
#chatContainer{flex:1;display:flex;flex-direction:column;width:100%;gap:8px;min-height:0}
#chatMsgs{flex:1;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:8px;padding:10px;font-size:14px;min-height:0;-webkit-overflow-scrolling:touch}
#imgList{display:none;flex-wrap:wrap;gap:10px;padding:8px;background:rgba(0,0,0,0.15);border-radius:6px;max-height:90px;overflow-y:auto;flex-shrink:0;align-items:center}
#imgList .thumb-wrap{display:inline-flex;align-items:center;background:rgba(255,255,255,0.05);border-radius:4px;padding:2px;position:relative}
#imgList .thumb{width:40px;height:40px;object-fit:cover;border-radius:3px}
#imgList .close{font-size:26px;color:#ff4757;cursor:pointer;line-height:1;margin-left:6px;font-weight:bold;padding:0 4px}
#imgList .count{color:#6a7a8a;font-size:11px;margin-left:4px}
#inputRow{display:flex;gap:8px;align-items:stretch;flex-shrink:0}
#chatInput{flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,255,0.2);border-radius:8px;padding:10px;color:#c8d8e8;font-size:14px;min-width:0}
#chatInput:focus{outline:none;border-color:var(--accent)}
.btn-square{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:18px;font-weight:600;flex-shrink:0}
.btn-pic{background:rgba(255,107,157,0.3);color:#fff;border:1px solid var(--yi)}
.btn-send{width:auto;padding:0 16px;background:var(--accent);color:#000;border:none;font-size:14px}
.yi-test{font-family:'LSTY-Yi-SMP';font-size:28px;text-align:center;padding:16px;color:#ffe66d;line-height:2;word-break:break-all}
#notification{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid rgba(0,212,255,0.2);border-radius:8px;padding:10px 14px;font-size:12px;z-index:200;display:none;max-width:280px}
#font-guide code{background:#1a2332;padding:2px 6px;border-radius:3px;font-size:12px;color:var(--accent);word-break:break-all}
pre{background:rgba(0,0,0,0.3);border-radius:6px;padding:10px;overflow:auto;font-size:12px;font-family:'LSTY-Yi-SMP',monospace;color:var(--accent);white-space:pre-wrap;word-break:break-all;max-height:200px}
button:not(.btn-square){background:var(--accent);color:#000;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin:4px}
a{color:var(--accent)}
/* Mobile */
@media(max-width:640px){#desktop-grid{grid-template-columns:repeat(5,1fr);gap:8px 4px;padding:10px 4px;max-width:none}.desktop-icon{width:64px;padding:8px 2px}.desktop-icon .icon{font-size:34px}.desktop-icon .label{font-size:12px}.desktop-icon .label.yi-text{font-size:13px}#window{top:6%;left:1%;right:1%;bottom:1%}#chatContainer{gap:6px}#chatMsgs{font-size:13px}#imgList{max-height:80px}.btn-square{width:44px;height:44px;font-size:16px}#inputRow{gap:6px}}
</style></head><body>
<canvas id="bg"></canvas>
<div id="desktop">
<header id="taskbar">
<div class="title" id="taskbarTitle">QEntL <span>量子操作系统</span></div>
<div class="lang-switch">
<button class="lang-btn active" onclick="setLang('zh')">中文</button>
<button class="lang-btn" onclick="setLang('en')">EN</button>

</div>

</header>

</div>
<div id="window"><div class="win-header"><span class="win-title" id="winTitle">应用</span><button class="win-close" onclick="closeApp()">✕</button></div><div class="win-body" id="winBody"></div></div>
<div id="notification"></div>
<script>
var apps=[
{id:'assistant',icon:'🔮',zh:'小趣QSM',en:'QSM',yi:'󲝁󲥰'},
{id:'qvm',icon:'⚛',zh:'量子虚拟机',en:'Quantum VM',yi:'󳔄'},
{id:'qcalc',icon:'🧮',zh:'量子计算器',en:'Quantum Calc',yi:'󲧖'},
{id:'qide',icon:'💻',zh:'QEntL编辑器',en:'QEntL Editor',yi:'󲡳'},
{id:'qviz',icon:'🎭',zh:'量子态可视化',en:'Quantum Viz',yi:'󲰱'},
{id:'compiler',icon:'🔧',zh:'编译器',en:'Compiler',yi:'󲡳'},
{id:'files',icon:'📁',zh:'文件管理',en:'Files',yi:'󲫔'},
{id:'terminal',icon:'🖥',zh:'终端',en:'Terminal',yi:'󲟁'},
{id:'economy',icon:'💰',zh:'经济系统',en:'Economy',yi:'󳒺'},
{id:'social',icon:'💬',zh:'社交网络',en:'Social',yi:'󲰇'},
{id:'monitor',icon:'🪞',zh:'系统监控',en:'Monitor',yi:'󳃭'},
{id:'store',icon:'🏪',zh:'应用商店',en:'Store',yi:'󲝏'},
{id:'yi',icon:'🀆',zh:'彝文4120',en:'Yi 4120',yi:'󲥰'},
{id:'font',icon:'🔤',zh:'字体安装',en:'Font',yi:'󲫐'},
{id:'help',icon:'📖',zh:'帮助',en:'Help',yi:'󲥌'},
{id:'docs',icon:'📚',zh:'文档中心',en:'Docs',yi:'󲫔'},
{id:'about',icon:'ℹ',zh:'关于QEntL',en:'About',yi:'󲥰'}
];
var lang='zh';
function render(){var d=document.getElementById('desktop-grid'),html='';for(var i=0;i<apps.length;i++){var a=apps[i];var lb=lang==='yi'?'<div class="label yi-text">'+a.yi+'</div>':(lang==='en'?'<div class="label">'+a.en+'</div>':'<div class="label">'+a.zh+'</div>');html+='<div class="desktop-icon" onclick="openApp(\''+a.id+'\')"><div class="icon">'+a.icon+'</div>'+lb+'</div>';}d.innerHTML=html;}
function setLang(l){lang=l;var btns=document.querySelectorAll('.lang-btn');for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',(l==='zh'&&i===0)||(l==='en'&&i===1)||(l==='yi'&&i===2));}var t=document.getElementById('taskbarTitle');if(l==='yi'){t.innerHTML='QEntL <span class="yi-text">󲥰󳒺󲰇󳃭</span>';}else{t.innerHTML='QEntL <span>'+(l==='en'?'Quantum OS':'量子操作系统')+'</span>';}render();}
function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});};setInterval(clock,1000);clock();
function openApp(id){var win=document.getElementById('window'),title=document.getElementById('winTitle'),body=document.getElementById('winBody');win.classList.add('show');var a=null;for(var i=0;i<apps.length;i++){if(apps[i].id===id){a=apps[i];break;}}if(!a)return;var t=lang==='yi'?a.yi:(lang==='en'?a.en:a.zh);title.textContent=t;var b='';if(id==='assistant'){b=assistantHTML();}else if(id==='qvm'){b='<div class="status-bar"><span class="status-dot blue"></span> 量子虚拟机</div><pre>QVM 运行: 正常 ✅\nQCL 编译: errors=0 ✅</pre>';}else if(id==='qcalc'){b='<input type="text" id="qasmInput" value="h q[0]; cx q[0],q[1]" style="width:100%;padding:8px;margin:6px 0"><button onclick="runQasm()">执行</button><pre id="qasmResult">点击执行</pre>';}else if(id==='qide'){b+='<a href="/ide">QEntL 在线编辑器 →</a>';}else if(id==='qviz'){b+='<a href="/q3d">3D量子态可视化 →</a>';}else if(id==='compiler'){b+='<pre>QCL 自举编译: 28529字节 ✅\nMD5: eadf5be34239b49567d8f99df69260c5</pre>';}else if(id==='files'){b+='<div class="status-bar"><span class="status-dot green"></span> qdfs_merge / qdfs_split</div><div class="status-bar"><span class="status-dot blue"></span> system/models/users/apps</div>';}else if(id==='terminal'){b+='<a href="/ide">QEntL 终端 →</a>';}else if(id==='economy'){b+='<pre>SOM 经济引擎: 活跃 ✅\n风险预测: 8/10 精准 ✅</pre>';}else if(id==='social'){b+='<pre>WeQ 纠缠通信: 10/10 ✅</pre>';}else if(id==='monitor'){b+='<pre>Ref 系统健康: 全部在线 ✅</pre>';}else if(id==='store'){b='<div class="status-bar"><span class="status-dot yellow"></span> 应用商店准备中</div>';}else if(id==='yi'){b=yiApp();}else if(id==='font'){b=fontApp();}else if(id==='help'){b='<p>三语言切换: 中文/EN/彝</p>';}else if(id==='docs'){b+='<a href="/docs">文档中心 →</a>';}else if(id==='about'){b='<div style="text-align:center;padding:20px"><div style="font-size:42px">⚛</div><div style="font-size:17px;font-weight:700;color:var(--accent);margin:8px 0">QEntL 量子操作系统</div><div style="font-size:12px;color:#6a7a8a">构建链: C→QCL→QVM→QDFS→QNS→4模型</div></div>';}body.innerHTML=b;}
function closeApp(){document.getElementById('window').classList.remove('show');}

function assistantHTML(){
return '<div class="status-bar"><span class="status-dot blue"></span> 小趣QSM — 真权重双引擎 (B生成+B→A内积识别)</div>'+
'<div id="chatContainer">'+
'<div id="chatMsgs"><div style="color:#6a7a8a;font-size:12px;line-height:1.7">💬 试试：<br>🔹 <b>生成 10</b> → B起点生成32×32彝文(真权重QDFS) 🎨<br>🔹 <b>识别</b> → 上传图片→A识别真权重内积argmax →<br>🔹 <b>U+F221A</b> → 取32×32字形<br>🔹 <b>📷图片</b> 选图后<b>点发送</b>上传识别<br>🔹 输入<b>彝文</b> → 自动识别</div></div>'+
'<div id="imgList"></div>'+
'<div id="inputRow">'+
'<input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="pickImages(this)">'+
'<button class="btn-square btn-pic" onclick="pickImagesFile()" title="选图">📷</button>'+
'<input type="text" id="chatInput" placeholder="输入文字 或 选图后点发送" style="flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,255,0.2);border-radius:8px;padding:10px;color:#c8d8e8;font-size:14px;min-width:0" onkeydown="if(event.keyCode==13)sendChat()">'+
'<button class="btn-square btn-send" onclick="sendChat()">发送</button>'+
'</div></div>';
}

var pendingImages=[];
function pickImagesFile(){document.getElementById("imgInput").click();}
function pickImages(inp){var list=document.getElementById('imgList');if(!inp.files||!inp.files[0]){return;}for(var i=0;i<inp.files.length;i++){pendingImages.push(inp.files[i]);}renderImgList();inp.value='';}
function renderImgList(){var list=document.getElementById('imgList');list.innerHTML='';list.style.display='flex';for(var j=0;j<pendingImages.length;j++){(function(idx){var f=pendingImages[idx];var wrap=document.createElement('span');wrap.className='thumb-wrap';var thumb=document.createElement('img');thumb.className='thumb';thumb.src=URL.createObjectURL(f);var close=document.createElement('span');close.className='close';close.textContent='✕';close.onclick=function(e){e.stopPropagation();pendingImages.splice(idx,1);renderImgList();};wrap.appendChild(thumb);wrap.appendChild(close);list.appendChild(wrap);})(j)}var t=document.createElement('span');t.className='count';t.textContent=pendingImages.length+'张';list.appendChild(t);if(pendingImages.length===0){list.style.display='none';}}

function sendChat(){var input=document.getElementById('chatInput');var msgs=document.getElementById('chatMsgs');if(!input||!msgs)return;var txt=input.value.trim();var hasPic=pendingImages.length>0;var userLabel=hasPic?('[图片'+pendingImages.length+'张] '+(txt||'')):(txt||'');if(!userLabel)return;msgs.innerHTML+='<div style="margin:6px 0;padding:8px;background:rgba(0,212,255,0.1);border-radius:6px">你: '+userLabel+'</div>';msgs.scrollTop=msgs.scrollHeight;input.value='';if(hasPic){uploadImages();}else if(txt){doChat(txt);}}
var _busy=false;
var doFetch=function(url, body){
  return new Promise(function(rRes,rRej){
    var xhr=new XMLHttpRequest();
    xhr.timeout=45000;
    xhr.open('POST',url,true);
    xhr.setRequestHeader('Content-Type','text/plain');
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4){return;}
      rRes(xhr.responseText);
    };
    xhr.ontimeout=function(){rRej('timeout');};
    xhr.onerror=function(){rRej('error');};
    xhr.send(body);
  });
};
var doChat=function(txt){
  if(_busy){var msgs=document.getElementById('chatMsgs');msgs.innerHTML+='<div style="margin:6px 0;color:#ffd700;font-size:12px">⏳ 等待上次完成...</div>';return;}
  _busy=true;
  var msgs=document.getElementById('chatMsgs');
  var wt=document.createElement('div');wt.style.cssText='margin:4px 0;color:#6a7a8a;font-size:12px';wt.textContent='处理中...';
  msgs.appendChild(wt);msgs.scrollTop=msgs.scrollHeight;
  doFetch('/api/yi',txt).then(function(data){
    if(wt.parentNode)wt.remove();
    try{appendMsg(msgs,data);}catch(e){msgs.innerHTML+='<div style="color:#ff4757;font-size:12px">解析失败: '+String(e)+'</div>';}
    _busy=false;
  }).catch(function(e){
    if(wt.parentNode)wt.remove();
    _busy=false;
    msgs.innerHTML+='<div style="margin:6px 0;color:#ff4757;font-size:12px">失败: '+String(e)+'</div>';
  });
};

function uploadImages(){var imgs=pendingImages.slice(0);pendingImages=[];renderImgList();var msgs=document.getElementById('chatMsgs');msgs.innerHTML+='<div style="margin:4px 0;color:#6a7a8a;font-size:12px">处理 '+imgs.length+' 张图片...</div>';msgs.scrollTop=msgs.scrollHeight;var done=0;for(var k=0;k<imgs.length;k++){(function(k){var img=imgs[k];var canvas=document.createElement('canvas');canvas.width=32;canvas.height=32;var ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,32,32);var im=new Image();im.onload=function(){ctx.drawImage(im,0,0,32,32);var id=ctx.getImageData(0,0,32,32);var px=[];for(var i=0;i<1024;i++){var idx=i*4;var lum=0.299*id.data[idx]+0.587*id.data[idx+1]+0.114*id.data[idx+2];px.push(lum>128?1:0);}doFetch('/api/yi32',px.join(',')).then(function(data){appendMsg(msgs,'[图片'+(k+1)+'/'+imgs.length+'] '+data);done++;if(done===imgs.length){var d=document.createElement('div');d.style.cssText='margin:6px 0;padding:6px;color:#6a7a8a;font-size:12px';d.textContent='全部完成 '+done+'/'+imgs.length;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}}).catch(function(e){msgs.innerHTML+='<div style="color:#ff4757;font-size:12px">[图片'+(k+1)+'] 失败</div>';done++;});};im.src=URL.createObjectURL(img);})(k)} }

function appendMsg(msgs,data){try{

wrap=document.createElement('div');wrap.style.cssText='display:flex;align-items:center;gap:12px';var gld=document.createElement('div');gld.style.cssText='font-family:LSTY-Yi-SMP,LSTY-Yi-Black,YiTongyong,sans-serif;font-size:44px;color:#ffe66d;min-width:48px;text-align:center';try{gld.appendChild(document.createTextNode(String.fromCodePoint(cp)));}catch(e2){gld.textContent='?';}wrap.appendChild(gld);div.appendChild(wrap);}if(!hasChar){div.innerHTML+='<div style="white-space:pre-wrap">'+data+'</div>';}msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
