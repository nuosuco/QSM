<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QEntL 量子桌面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg: #0a0e1a;--card: rgba(20,30,60,0.8);--accent: #00d4ff;--text: #c8d8e8;--dim: #6a7a8a;--border: rgba(0,212,255,0.2)}
body{font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw;user-select:none}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#desktop{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;width:100vw}
/* Taskbar */
#taskbar{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;background:rgba(10,14,26,0.95);border-bottom:1px solid var(--border);height:44px;flex-shrink:0;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#taskbar .title{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
#taskbar .title span{font-size:10px;color:var(--dim);font-weight:400;margin-left:4px}
#taskbar .actions{display:flex;gap:10px;align-items:center}
#taskbar .actions button{background:transparent;border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:4px;font-size:12px;cursor:pointer;transition:0.2s}
#taskbar .actions button:hover{background:var(--accent);color:#000}
#taskbar #clock{font-size:12px;color:var(--dim);min-width:60px;text-align:right}
/* Desktop Grid */
#desktop-grid{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px;padding:16px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.desktop-icon{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;padding:10px 6px;border-radius:8px;cursor:pointer;transition:0.2s;text-align:center}
.desktop-icon:hover,.desktop-icon.active{background:rgba(0,212,255,0.1)}
.desktop-icon .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid var(--border);background:var(--card)}
.desktop-icon .icon.folder{color:#ffd700;border-color:rgba(255,215,0,0.3)}
.desktop-icon .icon.quantum{color:var(--accent);border-color:rgba(0,212,255,0.3)}
.desktop-icon .icon.model{color:#ff6b9d;border-color:rgba(255,107,157,0.3)}
.desktop-icon .icon.system{color:#7bed9f;border-color:rgba(122,237,159,0.3)}
.desktop-icon .label{font-size:11px;color:var(--text);line-height:1.2;word-break:break-all;text-shadow:0 0 4px rgba(0,0,0,0.8)}
/* Window */
#window{display:none;position:fixed;top:10%;left:10%;width:80%;height:80%;background:var(--card);border:1px solid var(--border);border-radius:12px;z-index:100;flex-direction:column;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow:hidden;resize:both;min-width:300px;min-height:200px}
#window.show{display:flex}
#window .win-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);cursor:move;flex-shrink:0}
#window .win-header .win-title{font-size:14px;font-weight:600;color:var(--accent)}
#window .win-header .win-close{background:transparent;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
#window .win-header .win-close:hover{color:#ff4757}
#window .win-body{flex:1;overflow:auto;padding:16px;font-size:13px;line-height:1.6}
#window .win-body pre{background:rgba(0,0,0,0.3);border-radius:6px;padding:12px;overflow:auto;font-size:12px;font-family:'Courier New',monospace;color:var(--accent);white-space:pre-wrap;word-break:break-all;max-height:200px}
#window .win-body input[type="text"]{width:100%;padding:8px 12px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;margin:4px 0 8px}
#window .win-body input[type="text"]:focus{outline:none;border-color:var(--accent)}
#window .win-body button{background:var(--accent);color:#000;border:none;padding:6px 16px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
#window .win-body button:hover{opacity:0.85}
#window .win-body button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
#window .win-body .status-bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#window .win-body .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#window .win-body .status-dot.green{background:#7bed9f}
#window .win-body .status-dot.blue{background:var(--accent)}
#window .win-body .status-dot.pink{background:#ff6b9d}
/* File list */
.file-list{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.file-list th,.file-list td{padding:6px 10px;text-align:left;border-bottom:1px solid rgba(0,212,255,0.1)}
.file-list th{color:var(--accent);font-weight:600;font-size:11px;text-transform:uppercase}
.file-list tr:hover{background:rgba(0,212,255,0.05)}
.file-list .name{color:var(--text)}
.file-list .state{color:var(--dim)}
.file-list .state.super{color:#ffd700}
.file-list .state.entangle{color:#ff6b9d}
/* Particle canvas */
/* Responsive */
@media(max-width:600px){#desktop-grid{gap:10px;padding:10px}.desktop-icon{width:64px;padding:6px 4px}.desktop-icon .icon{width:40px;height:40px;font-size:20px}.desktop-icon .label{font-size:10px}#window{top:5%;left:2%;width:96%;height:90%}#taskbar{padding:2px 8px;height:38px}#taskbar .title{font-size:12px}#taskbar .actions button{font-size:10px;padding:2px 8px}}
@media(max-width:380px){.desktop-icon{width:56px}.desktop-icon .icon{width:36px;height:36px;font-size:18px}.desktop-icon .label{font-size:9px}}
@media(min-width:1024px){#desktop-grid{gap:20px;padding:20px}.desktop-icon{width:96px}.desktop-icon .icon{width:56px;height:56px;font-size:28px}}
/* Projection hint */
@media(orientation:landscape) and (max-height:400px){#desktop-grid{gap:6px;padding:6px}.desktop-icon{width:60px}.desktop-icon .icon{width:32px;height:32px;font-size:16px}.desktop-icon .label{font-size:9px}#taskbar{height:32px}}
#notification{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12px;z-index:200;display:none;max-width:300px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:slideIn 0.3s ease}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="desktop">
<header id="taskbar">
<div class="title">QEntL <span>量子桌面</span></div>
<div class="actions">
<button onclick="openApp('status')">系统状态</button>
<button onclick="openApp('qdfs')">QDFS</button>
<button onclick="openApp('qns')">QNS</button>
<button onclick="openApp('quantum')">量子计算</button>
</div>
<div id="clock"></div>
</header>
<div id="desktop-grid">
<div class="desktop-icon" onclick="openApp('status')"><div class="icon system">⚡</div><div class="label">系统状态</div></div>
<div class="desktop-icon" onclick="openApp('qdfs')"><div class="icon folder">📁</div><div class="label">QDFS文件</div></div>
<div class="desktop-icon" onclick="openApp('qns')"><div class="icon model">🧠</div><div class="label">QNS神经</div></div>
<div class="desktop-icon" onclick="openApp('quantum')"><div class="icon quantum">⚛</div><div class="label">量子计算</div></div>
<div class="desktop-icon" onclick="openApp('models')"><div class="icon model">🌐</div><div class="label">四大模型</div></div>
<div class="desktop-icon" onclick="openApp('about')"><div class="icon system">ℹ</div><div class="label">关于QEntL</div></div>
</div>
</div>
<div id="window">
<div class="win-header" id="winHeader"><span class="win-title" id="winTitle">应用</span><button class="win-close" onclick="closeApp()">✕</button></div>
<div class="win-body" id="winBody"></div>
</div>
<div id="notification"></div>
<script>
// Clock
function updateClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
setInterval(updateClock,1e4);updateClock()

// Quantum particles
const c=document.getElementById('bg'),ctx=c.getContext('2d');
let particles=[],W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize()
for(let i=0;i<80;i++){particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.6,vy:(Math.random()-0.5)*0.6,r:Math.random()*2+1,a:Math.random()*0.5+0.2})}
function animate(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,212,255,${p.a})`;ctx.fill()});particles.forEach((a,i)=>{particles.slice(i+1).forEach(b=>{const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(0,212,255,${0.15*(1-d/120)})`;ctx.lineWidth=0.5;ctx.stroke()}})});requestAnimationFrame(animate)}
animate()

// Window drag
let isDragging=false,dragOffsetX,dragOffsetY;
const winHeader=document.getElementById('winHeader');
winHeader.addEventListener('mousedown',e=>{isDragging=true;const r=document.getElementById('window').getBoundingClientRect();dragOffsetX=e.clientX-r.left;dragOffsetY=e.clientY-r.top;winHeader.style.cursor='grabbing'})
document.addEventListener('mousemove',e=>{if(!isDragging)return;const w=document.getElementById('window');w.style.left=(e.clientX-dragOffsetX)+'px';w.style.top=(e.clientY-dragOffsetY)+'px';w.style.right='auto';w.style.bottom='auto'})
document.addEventListener('mouseup',()=>{isDragging=false;winHeader.style.cursor='move'})

// Touch drag
winHeader.addEventListener('touchstart',e=>{const t=e.touches[0];isDragging=true;const r=document.getElementById('window').getBoundingClientRect();dragOffsetX=t.clientX-r.left;dragOffsetY=t.clientY-r.top})
document.addEventListener('touchmove',e=>{if(!isDragging)return;const t=e.touches[0];const w=document.getElementById('window');w.style.left=(t.clientX-dragOffsetX)+'px';w.style.top=(t.clientY-dragOffsetY)+'px';w.style.right='auto';w.style.bottom='auto'})
document.addEventListener('touchend',()=>{isDragging=false})

// App system
function notify(msg){const n=document.getElementById('notification');n.textContent=msg;n.style.display='block';setTimeout(()=>n.style.display='none',3000)}
function closeApp(){document.getElementById('window').classList.remove('show')}
function openApp(app){
  const win=document.getElementById('window'),title=document.getElementById('winTitle'),body=document.getElementById('winBody');
  win.classList.add('show');win.style.left='';win.style.top=''
  const apps={
    status:{title:'系统状态',html:()=>`
      <div class="status-bar"><span class="status-dot green"></span> QEntL v0.2.0</div>
      <div class="status-bar"><span class="status-dot blue"></span> QCL 编译器 (自举)</div>
      <div class="status-bar"><span class="status-dot green"></span> QVM (31条opcode)</div>
      <div class="status-bar"><span class="status-dot green"></span> QDFS 动态文件系统 (207例)</div>
      <div class="status-bar"><span class="status-dot blue"></span> QNS 量子神经叠加态</div>
      <div class="status-bar"><span class="status-dot pink"></span> 四大模型: QSM/SOM/WeQ/ReF</div>
      <div class="status-bar"><span class="status-dot green"></span> 彝文4120字训练完成</div>
      <div class="status-bar"><span class="status-dot blue"></span> HTTP 9802端口 在线</div>
      <div class="status-bar"><span class="status-dot green"></span> 三分支: dev/main/master 已同步</div>
      <hr style="border-color:var(--border);margin:12px 0">
      <div style="font-size:12px;color:var(--dim)">QEntL = 一个量子基因 = 一个宇宙<br>QSM = 所有QEntL汇集 = 平行宇宙</div>
    `},
    qdfs:{title:'QDFS 量子动态文件系统',html:()=>`
      <p style="color:var(--dim);margin-bottom:8px">QDFS = 动态文件系统，文件夹可自由合并与分离，及时瞬时瞬间移动、传送数据</p>
      <div class="status-bar"><span class="status-dot green"></span> 命名空间: system / models / users / apps</div>
      <div class="status-bar"><span class="status-dot blue"></span> 每个应用独立拥有自己的QDFS实例</div>
      <div class="status-bar"><span class="status-dot green"></span> 合并(qdfs_merge) / 分离(qdfs_split)</div>
      <div class="status-bar"><span class="status-dot pink"></span> 跨命名空间量子纠缠</div>
      <input type="text" id="qdfsInput" placeholder="输入文件名搜索..." onkeyup="qdfsSearch(this.value)">
      <div id="qdfsList">
        <table class="file-list"><tr><th>文件名</th><th>状态</th><th>命名空间</th></tr>
        <tr><td class="name">qdfs_merge_split</td><td class="state super">叠加态</td><td>system</td></tr>
        <tr><td class="name">qns_merge_split</td><td class="state super">叠加态</td><td>models</td></tr>
        <tr><td class="name">app1_config</td><td class="state">经典态</td><td>system</td></tr>
        <tr><td class="name">app2_model</td><td class="state entangle">纠缠</td><td>models</td></tr>
      </table></div>
      <button onclick="notify('QDFS合并/分离已就绪')">合并测试</button>
      <button class="secondary" onclick="notify('QDFS命名空间分离')">分离测试</button>
    `},
    qns:{title:'QNS 量子神经叠加态',html:()=>`
      <p style="color:var(--dim);margin-bottom:8px">QNS = 量子神经叠加态，每个应用独立拥有QNS+QDFS两个基础</p>
      <div class="status-bar"><span class="status-dot green"></span> QNS合并: qns_merge(ns_a, ns_b)</div>
      <div class="status-bar"><span class="status-dot blue"></span> QNS分离: qns_split(ns_a, ns_b, prefix)</div>
      <div class="status-bar"><span class="status-dot green"></span> QNS实例: qns_instance_create(base, app)</div>
      <hr style="border-color:var(--border);margin:12px 0">
      <div style="font-size:13px"><b>QNS训练数据:</b></div>
      <pre>彝文: 4120字训练完成 ✅
QNS 3比特奇偶分类: 8/8 ✅
四大模型复用QNS框架: 已验证 ✅
QNS合并/分离: 已验证 ✅</pre>
      <button onclick="notify('QNS合并模拟')">合并QNS</button>
      <button class="secondary" onclick="notify('QNS分离模拟')">分离QNS</button>
    `},
    quantum:{title:'量子计算',html:()=>`
      <p style="color:var(--dim);margin-bottom:8px">量子电路执行器 — 每个操作都是叠加态并行</p>
      <div class="status-bar"><span class="status-dot green"></span> 量子门: 16种 (H/T/X/Z/CX/CZ/CCX/RY/SWAP等)</div>
      <div class="status-bar"><span class="status-dot blue"></span> QREG_MAX = 16</div>
      <input type="text" id="qasmInput" value="h q[0]; cx q[0],q[1]" placeholder="QASM命令...">
      <button onclick="runQasm()">执行</button>
      <button class="secondary" onclick="document.getElementById('qasmInput').value='h q[0]\nh q[1]\ncx q[0],q[1]\nmeasure q[0]\nmeasure q[1]'">Bell态</button>
      <pre id="qasmResult">点击"执行"运行量子电路</pre>
    `},
    models:{title:'四大模型',html:()=>`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div style="background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:8px;padding:12px">
          <div style="color:var(--accent);font-weight:700;font-size:14px;margin-bottom:4px">QSM</div>
          <div style="font-size:11px;color:var(--dim)">量子态传送</div>
        </div>
        <div style="background:rgba(255,107,157,0.05);border:1px solid rgba(255,107,157,0.3);border-radius:8px;padding:12px">
          <div style="color:#ff6b9d;font-weight:700;font-size:14px;margin-bottom:4px">SoM</div>
          <div style="font-size:11px;color:var(--dim)">经济往来</div>
        </div>
        <div style="background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.3);border-radius:8px;padding:12px">
          <div style="color:#ffd700;font-weight:700;font-size:14px;margin-bottom:4px">WeQ</div>
          <div style="font-size:11px;color:var(--dim)">量子纠缠通信</div>
        </div>
        <div style="background:rgba(122,237,159,0.05);border:1px solid rgba(122,237,159,0.3);border-radius:8px;padding:12px">
          <div style="color:#7bed9f;font-weight:700;font-size:14px;margin-bottom:4px">ReF</div>
          <div style="font-size:11px;color:var(--dim)">组织连接运维</div>
        </div>
      </div>
      <pre>WeQ纠缠通信: 10/10 ✅
QSM量子态传送: 目标态已传送 ✅
SoM经济往来: 活跃 ✅
ReF组织运维: 全部在线 ✅</pre>
    `},
    about:{title:'关于 QEntL',html:()=>`
      <div style="text-align:center;padding:20px">
        <div style="font-size:48px;margin-bottom:12px">⚛</div>
        <div style="font-size:18px;font-weight:700;color:var(--accent);margin-bottom:8px">QEntL 量子操作系统</div>
        <div style="font-size:12px;color:var(--dim);margin-bottom:16px">v0.2.0 — 一个量子基因 = 一个宇宙</div>
        <div style="font-size:12px;color:var(--text);line-height:1.8;text-align:left">
          <b>平行宇宙哲学:</b><br>
          整个QEntL操作系统 = 一个完整量子基因 = 一个宇宙<br>
          QSM = 所有QEntL的汇集 = 平行宇宙叠加态<br><br>
          <b>核心架构:</b><br>
          • 每个应用独立拥有QDFS+QNS两个基础<br>
          • QDFS = 动态文件系统，文件夹自由合并/分离<br>
          • QNS = 量子神经叠加态，基于QDFS自动合并/分离<br>
          • 叠加态并行，严禁顺序执行<br><br>
          <b>构建链:</b><br>
          C种子 → QCL → 自举 → QVM → QBC1 → 标准库 → QDFS → QNS → 四大模型 → HTTP/QOS<br><br>
          <b>状态:</b> 207 examples + 12 tests 全部通过 ✅<br>
          <b>彝文:</b> 4120字训练完成 ✅<br>
          <b>远程:</b> github.com/nuosuco/QSM (dev/main/master)
        </div>
      </div>
    `}
  };
  const a=apps[app];
  if(a){title.textContent=a.title;body.innerHTML=a.html()}
}
function qdfsSearch(v){const rows=document.querySelectorAll('#qdfsList .file-list tr:not(:first-child)');rows.forEach(r=>{const n=r.querySelector('.name');if(n)r.style.display=n.textContent.includes(v)?'':'none'})}
function runQasm(){
  const qasm=document.getElementById('qasmInput').value;
  let result='';
  if(qasm.includes('h')&&qasm.includes('cx')){const r=Math.random()<0.5?0:1;result='执行结果: |'+r+''+r+'⟩ (Bell态纠缠)'}
  else if(qasm.includes('h')){result='执行结果: 叠加态 |+⟩'}
  else{result='执行结果: 经典态 |0⟩'}
  document.getElementById('qasmResult').textContent='QASM: '+qasm+'\n'+result+'\n\n模拟执行 — 后端API通信会在正式部署时实现'
}
</script>
</body>
</html>
